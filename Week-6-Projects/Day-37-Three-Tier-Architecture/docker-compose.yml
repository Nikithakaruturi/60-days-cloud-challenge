
services:
  backend:
    build: ./backend
    container_name: employee-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3307
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: employee-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
